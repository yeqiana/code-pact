interface:
  display_name: "Code Pact"
  short_description: "Keep AI coding scoped, minimal, validated, and concise."
  default_prompt: "Use $code-pact: classify the task by risk; make the minimal sufficient change; respect tool safety and authorized scope; validate P0 with evidence; finish in the user language with these fields: Objective:, Changed Files:, Validation Results:, Risks:, Required Acceptance Checks:, Conclusion:. Translate labels when the user writes in another language."

policy:
  allow_implicit_invocation: true
